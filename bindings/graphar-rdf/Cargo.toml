[package]
name = "graphar-rdf-wasm"
version = "0.1.0-alpha.1"
description = "graphar-rdf's writer for JavaScript: the wasm32 module `@kanzo-tech/graphar/write` loads."
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
graphar-rdf.workspace = true
object_store.workspace = true
futures-util.workspace = true
oxrdf.workspace = true
oxttl.workspace = true
# Snappy, a codec in Rust: zstd's is C, and wasm32 has no C compiler here.
parquet = { workspace = true, features = ["snap"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
serde_json.workspace = true
# `ObjectStore` is `Send + Sync` and its futures `Send`; a JavaScript value and promise are neither.
# wasm32 here has one thread, and `SendWrapper` says so safely: it panics if moved off it.
async-trait = "0.1"
send_wrapper = { version = "0.6", features = ["futures"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[lints]
workspace = true
