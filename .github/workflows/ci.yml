name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the whole chain on the commit it is about to publish.
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml names the toolchain, its components and the wasm32 target;
      # `rustup toolchain install` with no argument installs what it names.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast
      - name: wasm32
        # RUSTFLAGS replaces .cargo/config.toml's target rustflags, so the getrandom cfg is here too.
        env:
          RUSTFLAGS: -D warnings --cfg getrandom_backend="wasm_js"
        run: >-
          cargo check --target wasm32-unknown-unknown --locked
          -p graphar-info -p graphar-parquet -p graphar-stats -p graphar-rdf
      - name: no tokio in the wasm32 build
        run: |
          if cargo tree --target wasm32-unknown-unknown -e normal --workspace --locked --prefix none \
              | grep -E '^tokio '; then
            echo "tokio reaches the wasm32 build" >&2
            exit 1
          fi
      # GraphAr's own Parquet test data, read through graphar-parquet. The commit is the one
      # graphar-info's fixtures were copied from.
      - uses: actions/checkout@v4
        with:
          repository: apache/incubator-graphar-testing
          ref: 8286724cd898047de833f0304dbddd2831afdf9f
          path: incubator-graphar-testing
          sparse-checkout: ldbc_sample/parquet
      - name: GraphAr's testing data
        env:
          GRAPHAR_TESTING: ${{ github.workspace }}/incubator-graphar-testing
        run: cargo test -p graphar-parquet --locked --test testing_data -- --ignored
      # conformance/{sample,user_defined} are what the C++ reader below and graphar-duckdb's tests
      # open, and they are exactly what the writer writes today.
      - name: conformance graphs are the writer's
        run: |
          rm -rf conformance/sample conformance/user_defined
          cargo run -p graphar-parquet --example sample --locked -- conformance
          git add -N conformance
          git diff --exit-code --stat -- conformance

  # graphar-stats' Theta sketches read by Apache DataSketches itself, and graphar-rdf's two mappings,
  # RML-Core and R2RML, run by two processors on two engines: Morph-KGC on DuckDB and PostgreSQL,
  # RMLMapper on PostgreSQL. Each must give back exactly the triples the graph was written from.
  interop:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pip install datasketches==5.2.0 duckdb==1.5.6 rdflib==7.2.1 morph-kgc==2.10.0 duckdb-engine==0.17.0 psycopg2-binary==2.9.13
      - name: DataSketches reads graphar-stats' sketch
        run: cargo run -q -p graphar-stats --example theta --locked | python3 -I crates/graphar-stats/tests/read_sketch.py
      - name: RMLMapper
        run: curl -sSfL -o rmlmapper.jar https://github.com/RMLio/rmlmapper-java/releases/download/v8.1.0/rmlmapper-8.1.0-r380-all.jar
      - name: the mappings on Morph-KGC and RMLMapper
        run: |
          d=crates/graphar-rdf/tests/data
          cargo run -q -p graphar-rdf --example write --locked -- $d/people.shacl.ttl $d/people.ttl people 2
          python3 -I conformance/rml/run.py people $d/people.ttl \
            --pg "host=127.0.0.1 port=5432 user=postgres password=postgres" --rmlmapper rmlmapper.jar

  # graphar-duckdb, tested on a native DuckDB against conformance/sample.
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # GraphAr's own C++ library opens what graphar-parquet wrote: `graphar` on PyPI is pybind11
  # bindings over libgraphar (mini-yaml, Arrow C++), installed in seconds where a source build of
  # Arrow C++ and GraphAr takes most of an hour.
  cpp-reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install graphar==0.13.0.dev1
      - run: python conformance/read_cpp.py conformance
